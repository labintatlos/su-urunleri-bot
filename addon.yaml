name: "Su Ürünleri Denetim Asistanı"
description: "Deniz görev alanı su ürünleri denetimi rehberi - Telegram Bot"
version: "5.0.0"
slug: "su_urunleri_bot"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: false
privileged: false
security: []
map:
  - config:rw
  - share:rw
  - logs:rw

options:
  bot_token: ""
  admin_id: ""
  allowed_users: []
  result_limit: 8
  timezone: "Europe/Istanbul"
  log_level: "INFO"
  enable_admin_panel: true
  rate_limit_enabled: true
  max_requests_per_minute: 10

schema:
  bot_token:
    description: "Telegram Bot Token (from @BotFather)"
    type: str
    required: true
  admin_id:
    description: "Admin Telegram ID (single or JSON list)"
    type: str
  allowed_users:
    description: "Allowed user IDs (list or JSON)"
    type: [str]
  result_limit:
    description: "Search results per query"
    type: int
    default: 8
    minimum: 1
    maximum: 20
  timezone:
    description: "Timezone for timestamps"
    type: str
    default: "Europe/Istanbul"
  log_level:
    description: "Logging level"
    type: str
    enum:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    default: "INFO"
  enable_admin_panel:
    description: "Enable admin statistics panel"
    type: bool
    default: true
  rate_limit_enabled:
    description: "Enable per-user rate limiting"
    type: bool
    default: true
  max_requests_per_minute:
    description: "Max requests per minute per user"
    type: int
    default: 10
    minimum: 1
    maximum: 60

ports:
  8000/tcp: "Health check endpoint"
  8001/tcp: "Webhook endpoint"

ports_description:
  8000/tcp: "Internal health check endpoint"
  8001/tcp: "Optional webhook endpoint for direct updates"
