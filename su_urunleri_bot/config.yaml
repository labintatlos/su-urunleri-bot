name: "Su Ürünleri Denetim Asistanı"
description: "Deniz görev alanı su ürünleri denetimi rehberi - Telegram Bot"
version: "5.4.0"
slug: "su_urunleri_bot"
url: "https://github.com/labintatlos/su-urunleri-bot"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: false
map:
  - share:rw

options:
  bot_token: ""
  admin_id: ""
  allowed_users: []
  result_limit: 8
  timezone: "Europe/Istanbul"
  log_level: "INFO"
  enable_admin_panel: true
  rate_limit_enabled: true
  max_requests_per_minute: 10

schema:
  bot_token: str
  admin_id: str?
  allowed_users:
    - str
  result_limit: int(1,20)
  timezone: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  enable_admin_panel: bool
  rate_limit_enabled: bool
  max_requests_per_minute: int(1,60)
