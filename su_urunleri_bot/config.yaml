name: "Su Ürünleri Denetim Asistanı"
description: "Deniz görev alanı su ürünleri denetimi rehberi — kullanıcı adı ve şifreyle açılan web sitesi"
version: "6.0.15"
slug: "su_urunleri_bot"
url: "https://github.com/labintatlos/su-urunleri-bot"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: false

# Ayni site Home Assistant yan menusunde de acilir; orada kimlik HA oturumundan
# gelir. Ingress portu disariya acilmaz.
ingress: true
ingress_port: 8099
panel_icon: mdi:fish
panel_title: Su Ürünleri

# 8101 kullanici adi/sifreyle acilan web sitesidir ve Ingress basliklarina hic
# guvenmez. Internete dogrudan duz HTTP olarak degil, KeenDNS gibi HTTPS veren
# bir yolla acilmalidir.
ports:
  8101/tcp: 8101
ports_description:
  8101/tcp: Web sitesi (kullanıcı adı ve şifre). İnternete KeenDNS gibi HTTPS veren bir yolla açın.

# Veritabani /share/su_urunleri_bot altinda durur; guncellemede silinmez.
map:
  - share:rw

options:
  gemini_api_key: ""
  gemini_model: "gemini-3.5-flash-lite"
  result_limit: 8
  timezone: "Europe/Istanbul"

schema:
  gemini_api_key: password?
  gemini_model: str?
  result_limit: int(1,20)
  timezone: str
