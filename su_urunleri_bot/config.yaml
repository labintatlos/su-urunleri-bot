name: "Su Ürünleri Denetim Asistanı"
description: "Deniz görev alanı su ürünleri denetimi rehberi - Telegram Bot"
version: "5.9.3"
slug: "su_urunleri_bot"
url: "https://github.com/labintatlos/su-urunleri-bot"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: false
map:
  - share:rw

options:
  bot_token: ""
  admin_id: ""
  gemini_api_key: ""
  gemini_model: "gemini-3.5-flash-lite"
  allowed_users: []
  result_limit: 8
  timezone: "Europe/Istanbul"

schema:
  bot_token: str
  admin_id: str?
  gemini_api_key: str?
  gemini_model: str?
  allowed_users:
    - str
  result_limit: int(1,20)
  timezone: str
