configuration:
  telegram_token:
    name: Telegram Bot Token
    description: Bot token created by BotFather.
  admin_ids:
    name: Administrator Telegram IDs
    description: One ID or multiple comma-separated IDs.
  allowed_user_ids:
    name: Allowed Telegram user IDs
    description: Other users allowed to use the bot. Leave empty for administrator-only access.
  timezone:
    name: Time zone
    description: Time zone used for date-sensitive fishing rules.
  result_limit:
    name: Search result limit
    description: Maximum number of search results shown per query.
