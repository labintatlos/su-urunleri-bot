[pytest]
# Pytest configuration

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add current directory to Python path
pythonpath = .

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    handler: Handler tests
    db: Database tests
    slow: Slow tests
    async: Async tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=bot
    --cov-report=term-missing
    --cov-report=html
    --asyncio-mode=auto

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning

# Test paths
testpaths = tests
